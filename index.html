<style>
/* ============================================================
   ТОКЕНЫ
   ============================================================ */
:root{
  --bg:#fff; --ink:#000; --mute:#858585; --line:#e6e6e6;
  --accent:#8FC4E8;
  --font:'Jost','Futura','Century Gothic','Trebuchet MS',sans-serif;
  --head:100px;
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-weight:400;-webkit-font-smoothing:antialiased;overflow-x:hidden;}
a{color:inherit;text-decoration:none;}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;}
img{display:block;max-width:100%;}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;}

/* ============================================================
   ШАПКА (как у образца: белая, фиксированная, меню справа)
   ============================================================ */
.head{position:fixed;inset:0 0 auto 0;z-index:40;height:var(--head);background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 20px;}
.brand{display:flex;flex-direction:column;gap:8px;}
.role{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--mute);line-height:1;white-space:nowrap;}
.logo{font-size:30px;font-weight:600;letter-spacing:2px;text-transform:uppercase;line-height:1;white-space:nowrap;}
.menu{display:flex;align-items:center;list-style:none;}
.menu li{padding:0 15px;}
.menu li:last-child{padding-right:0;}
.menu a,.menu button{position:relative;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--mute);transition:color .3s ease-in-out;}
.menu a::after,.menu button.lk::after{content:'';position:absolute;left:0;right:0;bottom:-6px;height:1px;background:var(--ink);opacity:0;transition:opacity .3s,bottom .3s;}
@media(hover:hover){.menu a:hover,.menu button:hover{color:var(--ink);}.menu a:hover::after,.menu button.lk:hover::after{opacity:1;bottom:-3px;}}
.menu a.on{color:var(--ink);font-weight:600;}
.lang{display:flex;gap:6px;margin-left:10px;}
.lang button{font-size:12px;letter-spacing:2px;color:var(--mute);}
.lang button[aria-pressed="true"]{color:var(--ink);font-weight:600;}
.burger{display:none;width:34px;height:34px;position:relative;}
.burger i{position:absolute;left:5px;right:5px;height:1px;background:var(--ink);transition:.3s;}
.burger i:nth-child(1){top:11px}.burger i:nth-child(2){top:17px}.burger i:nth-child(3){top:23px}
.burger.x i:nth-child(1){top:17px;transform:rotate(45deg)}.burger.x i:nth-child(2){opacity:0}.burger.x i:nth-child(3){top:17px;transform:rotate(-45deg)}

main{padding-top:var(--head);min-height:100vh;opacity:1;transition:opacity .2s ease-in-out;}
main.fade{opacity:0;}

/* ============================================================
   ГЛАВНАЯ: имя + плитки
   ============================================================ */

/* плитки — встык, 2 колонки, 0.56 как в образце */
.tiles{display:grid;grid-template-columns:1fr 1fr;}
.tile{position:relative;display:block;width:100%;aspect-ratio:1/.56;overflow:hidden;background:#111;cursor:pointer;text-align:center;}
.tile .bg{position:absolute;inset:0;background-size:cover;background-position:center;transition:transform .9s cubic-bezier(.2,.7,.3,1);}
.tile::before{content:'';position:absolute;inset:0;z-index:1;background:rgba(0,0,0,.3);transition:background .5s;}
.tile .tt{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;color:#fff;font-size:20px;line-height:1;letter-spacing:.04em;text-transform:uppercase;opacity:0;transform:translateY(8px);transition:opacity .45s,transform .45s;}
.tile .tt small{display:block;margin-bottom:10px;font-size:12px;letter-spacing:.24em;font-weight:300;opacity:.85;}
.tile .tt em{display:block;margin-top:12px;font-style:normal;font-size:11px;letter-spacing:.24em;font-weight:300;opacity:.8;}
@media(hover:hover){
  .tile:hover .bg,.tile:focus-visible .bg{transform:scale(1.06);}
  .tile:hover::before,.tile:focus-visible::before{background:rgba(0,0,0,.5);}
  .tile:hover .tt,.tile:focus-visible .tt{opacity:1;transform:none;}
}
@media(hover:none){.tile .tt{opacity:1;transform:none;}.tile::before{background:rgba(0,0,0,.38);}}
.tile.rv{opacity:0;transform:translateY(22px);transition:opacity .7s,transform .7s;}
.tile.rv.in{opacity:1;transform:none;}

.page-title{padding:44px 20px 36px;text-align:center;font-size:12px;letter-spacing:.32em;text-transform:uppercase;color:var(--mute);}
.empty{padding:120px 20px;text-align:center;color:var(--mute);letter-spacing:.2em;font-size:12px;text-transform:uppercase;}

/* ============================================================
   О РЕЖИССЁРЕ
   ============================================================ */
.about{max-width:1100px;margin:0 auto;padding:60px 20px 90px;display:grid;grid-template-columns:5fr 4fr;gap:clamp(30px,6vw,90px);align-items:start;}
.about.nophoto{grid-template-columns:minmax(0,560px);justify-content:center;}
.about .ph{aspect-ratio:4/5;background:#f2f2f2 no-repeat;background-size:cover;background-position:38% 28%;}
.about .tx p{font-size:15px;line-height:22px;margin-bottom:18px;}
.about .tx p strong{font-weight:600;}
.about .lead{font-size:22px !important;line-height:28px !important;font-weight:300;margin-bottom:26px !important;}
.about .tx h3{margin:34px 0 14px;font-size:12px;letter-spacing:.3em;text-transform:uppercase;font-weight:600;}
.cont{list-style:none;}
.cont li{display:flex;gap:16px;padding:9px 0;border-top:1px solid var(--line);font-size:15px;}
.cont li:last-child{border-bottom:1px solid var(--line);}
.cont span{width:96px;flex:none;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--mute);padding-top:3px;}
.cont a{transition:color .3s;}
.cont a:hover{color:var(--mute);}

/* ============================================================
   ПОДВАЛ
   ============================================================ */
footer{height:50px;display:flex;align-items:center;justify-content:center;margin-top:50px;}
footer ul{list-style:none;display:flex;flex-wrap:wrap;justify-content:center;}
footer li{padding:0 15px;}
footer a{font-size:12px;letter-spacing:2px;text-transform:uppercase;transition:color .3s;}
footer a:hover{color:var(--mute);}

/* ============================================================
   ПОПАП С ВИДЕО
   ============================================================ */
.pop{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.92);display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:60px 24px 24px;}
.pop.on{display:flex;}
.pop .x{position:absolute;top:18px;right:22px;width:34px;height:34px;}
.pop .x i{position:absolute;left:2px;right:2px;top:16px;height:2px;background:#fff;transition:background .3s;}
.pop .x i:first-child{transform:rotate(45deg)}.pop .x i:last-child{transform:rotate(-45deg)}
.pop .x:hover i{background:var(--accent);}
.pop .vid{width:min(1100px,100%,calc((100vh - 230px) * 16 / 9));aspect-ratio:16/9;background:#000;}
.pop .vid iframe{width:100%;height:100%;border:0;}
.pop .none{height:100%;display:grid;place-items:center;color:#aaa;font-size:12px;letter-spacing:.2em;text-transform:uppercase;border:1px solid #333;}
.pop .cap{width:min(1100px,100%,calc((100vh - 230px) * 16 / 9));color:#fff;}
.pop .cap .m{font-size:11px;letter-spacing:.26em;text-transform:uppercase;color:var(--accent);}
.pop .cap .t{margin-top:6px;font-size:clamp(20px,2.4vw,28px);letter-spacing:.04em;text-transform:uppercase;line-height:1.1;}
.pop .cap .i{margin-top:8px;font-size:13px;line-height:19px;font-weight:300;color:#bbb;white-space:pre-line;max-height:5.8em;overflow:auto;}

/* ============================================================
   АДАПТИВ
   ============================================================ */
@media(max-width:900px){
  .about{grid-template-columns:1fr;}
}
@media(max-width:820px){
  :root{--head:70px;}
  .logo{font-size:22px;}
  .brand{gap:6px;}
  .role{font-size:9px;letter-spacing:.14em;}
  .burger{display:block;}
  .menu{position:fixed;top:var(--head);left:0;right:0;flex-direction:column;align-items:flex-start;background:#fff;padding:6px 20px 22px;border-bottom:1px solid var(--line);transform:translateY(-8px);opacity:0;pointer-events:none;transition:.3s;}
  .menu.open{transform:none;opacity:1;pointer-events:auto;}
  .menu li{padding:12px 0;}
  .menu a,.menu button{font-size:14px;}
  .lang{margin:0;padding-top:6px;}
  .tiles{grid-template-columns:1fr;}
  .tile{aspect-ratio:1/.56;}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;}.tile.rv{opacity:1;transform:none;}html{scroll-behavior:auto;}}
</style>
</head>

const $ = s => document.querySelector(s);
const view = $('#view');
let lang = (navigator.language||'').slice(0,2)==='ru' ? 'ru' : 'en';
try{ const s = localStorage.getItem('lang'); if(s) lang = s; }catch(e){}

const ROUTES = {
  '':            {title:null, cat:null},
  'musicvideos': {title:'clip', cat:'clip'},
  'commercials': {title:'ad',   cat:'ad'},
  'film':        {title:'film', cat:'film'},
  'about':       {title:'about'}
};
let route = '';

const big = u => (u||'').replace(/-d_\d+/, '-d_960');
const split = s => { const i = s.indexOf(' — '); return i<0 ? ['', s] : [s.slice(0,i), s.slice(i+3)]; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function tileHTML(w,i){
  const [a,b] = split(w.title[lang]);
  return '<a class="tile rv" tabindex="0" role="button" data-i="'+i+'" aria-label="'+esc(w.title[lang])+'">'+
    '<div class="bg" style="background-image:url(\''+big(w.poster)+'\')"></div>'+
    '<div class="tt">'+(a?'<small>'+esc(a)+'</small>':'')+esc(b)+'<em>'+w.year+'</em></div></a>';
}

function renderHome(){
  return '<div class="tiles">'+WORKS.map(tileHTML).join('')+'</div>';
}
function renderCat(cat){
  const idx = WORKS.map((w,i)=>i).filter(i=>WORKS[i].cat===cat);
  return '<div class="page-title">'+T[lang][cat]+'</div>'+
    (idx.length ? '<div class="tiles">'+idx.map(i=>tileHTML(WORKS[i],i)).join('')+'</div>' : '<div class="empty">'+T[lang].empty+'</div>');
}
function renderAbout(){
  const t = T[lang];
  const photo = SITE.portrait ? '<div class="ph" style="background-image:url(\''+SITE.portrait+'\')"></div>' : '';
  return '<div class="about'+(photo?'':' nophoto')+'">'+photo+'<div class="tx">'+
    '<p class="lead">'+t.lead+'</p>'+t.bio.map(p=>'<p>'+p+'</p>').join('')+
    '<h3>'+t.contact+'</h3><ul class="cont">'+
      '<li><span>'+t.mail+'</span><a href="mailto:'+SITE.email+'">'+SITE.email+'</a></li>'+
      '<li><span>'+t.phone+'</span><a href="tel:'+SITE.phone.replace(/[^+\d]/g,'')+'">'+SITE.phone+'</a></li>'+
      SITE.links.map(l=>'<li><span>'+l.label+'</span><a href="'+l.url+'" target="_blank" rel="noopener">'+l.url.replace(/^https?:\/\/(www\.)?/,'')+'</a></li>').join('')+
    '</ul></div></div>';
}

let io;
function observe(){
  if(io) io.disconnect();
  io = new IntersectionObserver(es=>{
    es.forEach(e=>{ if(e.isIntersecting){ setTimeout(()=>e.target.classList.add('in'),(e.target.dataset.i%2)*90); io.unobserve(e.target); } });
  },{rootMargin:'0px 0px -6% 0px'});
  view.querySelectorAll('.tile').forEach(t=>io.observe(t));
}

function paint(){
  const r = ROUTES[route] || ROUTES[''];
  view.innerHTML = route==='about' ? renderAbout() : (r.cat ? renderCat(r.cat) : renderHome());
  observe();
  document.title = (r.title ? T[lang][r.title]+' — ' : '') + (lang==='ru' ? 'Илья Шпота' : 'Ilya Shpota');
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i]').forEach(el=>{ if(!el.classList.contains('tile')) el.textContent = T[lang][el.dataset.i]; });
  document.querySelectorAll('.menu a[data-r]').forEach(a=>a.classList.toggle('on', a.dataset.r===route));
  $('#role').textContent = T[lang].sub;
  $('#logo').textContent = lang==='ru' ? 'Илья Шпота' : 'Ilya Shpota';
  $('#ru').setAttribute('aria-pressed', lang==='ru');
  $('#en').setAttribute('aria-pressed', lang==='en');
  $('#foot').innerHTML = SITE.links.map(l=>'<li><a href="'+l.url+'" target="_blank" rel="noopener">'+l.label+'</a></li>').join('');
}

function go(){
  const next = (location.hash.replace(/^#\/?/,'') || '').split('?')[0];
  route = ROUTES[next] ? next : '';
  closeMenu();
  view.classList.add('fade');
  setTimeout(()=>{ paint(); scrollTo(0,0); view.classList.remove('fade'); }, 200);
}
addEventListener('hashchange', go);

/* ---------- меню ---------- */
const menu = $('#menu'), burger = $('#burger');
function closeMenu(){ menu.classList.remove('open'); burger.classList.remove('x'); burger.setAttribute('aria-expanded','false'); }
burger.onclick = ()=>{ const o = menu.classList.toggle('open'); burger.classList.toggle('x', o); burger.setAttribute('aria-expanded', o); };

/* ---------- язык ---------- */
function setLang(l){ lang = l; try{ localStorage.setItem('lang', l); }catch(e){} paint(); closeMenu(); }
$('#ru').onclick = ()=>setLang('ru');
$('#en').onclick = ()=>setLang('en');

/* ---------- попап ---------- */
const pop = $('#pop'), vid = $('#vid'), cap = $('#cap');
function openPop(i){
  const w = WORKS[i];
  vid.innerHTML = w.vimeo
    ? '<iframe src="https://player.vimeo.com/video/'+w.vimeo+'?autoplay=1&title=0&byline=0&portrait=0&color=8FC4E8" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>'
    : '<div class="none">'+T[lang].none+'</div>';
  const catName = {clip:T[lang].clip, ad:T[lang].ad, film:T[lang].film, action:T[lang].reel}[w.cat] || '';
  cap.innerHTML = '<div class="m">'+catName+(w.year?' · '+w.year:'')+'</div><div class="t">'+esc(w.title[lang])+'</div>'+(w.info?'<div class="i">'+esc(w.info)+'</div>':'');
  pop.classList.add('on'); document.body.style.overflow='hidden';
}
function closePop(){ pop.classList.remove('on'); vid.innerHTML=''; cap.innerHTML=''; document.body.style.overflow=''; }
$('#popx').onclick = closePop;
pop.onclick = e=>{ if(e.target===pop) closePop(); };
addEventListener('keydown', e=>{ if(e.key==='Escape') closePop(); if((e.key==='Enter'||e.key===' ') && e.target.classList && e.target.classList.contains('tile')){ e.preventDefault(); e.target.click(); } });
view.addEventListener('click', e=>{ const t = e.target.closest('.tile'); if(t) openPop(+t.dataset.i); });
$('#reelBtn').onclick = ()=>{ const i = WORKS.findIndex(w=>w.cat==='action'); if(i>-1) openPop(i); closeMenu(); };

/* ---------- старт ---------- */
(function(){ const next = (location.hash.replace(/^#\/?/,'') || '').split('?')[0]; route = ROUTES[next] ? next : ''; paint(); })();
</script>
</body>
</html>
