<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ilya Shpota — Director</title>
<meta name="description" content="Ilya Shpota — film director. Portfolio, showreel, contacts.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alumni+Sans:wght@300;500;700;900&family=JetBrains+Mono:wght@400;500&family=Onest:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#1e1e1e; --bg2:#262626; --line:#3a3a3a;
  --fg:#ececec; --mute:#9a9a9a; --accent:#8FC4E8;
  --display:'Alumni Sans',sans-serif; --body:'Onest',sans-serif; --mono:'JetBrains Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--fg);font:400 17px/1.6 var(--body);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.wrap{max-width:1280px;margin:0 auto;padding:0 24px}
.mono{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}

/* nav */
header{position:fixed;inset:0 0 auto 0;z-index:20;background:linear-gradient(var(--bg),transparent);}
nav{display:flex;align-items:center;justify-content:space-between;height:72px}
.logo{font:700 28px var(--display);letter-spacing:.04em;text-transform:uppercase}
.logo b{color:var(--accent)}
nav ul{display:flex;gap:28px;list-style:none;align-items:center}
nav a.l{font:500 12px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mute);transition:color .2s}
nav a.l:hover{color:var(--accent)}
.lang{font:500 12px var(--mono);border:1px solid var(--line);background:none;color:var(--fg);padding:6px 10px;cursor:pointer;border-radius:2px}
.lang:hover{border-color:var(--accent);color:var(--accent)}

/* hero */
.hero{min-height:100vh;display:flex;flex-direction:column;justify-content:flex-end;padding:120px 0 64px;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background:
  radial-gradient(60% 50% at 75% 30%,rgba(143,196,232,.14),transparent 70%),
  repeating-linear-gradient(90deg,transparent 0 119px,rgba(255,255,255,.025) 119px 120px);}
.hero .wrap{position:relative;width:100%}
.hero h1{font:900 clamp(88px,19vw,260px)/.82 var(--display);text-transform:uppercase;letter-spacing:-.01em}
.hero h1 span{color:var(--accent)}
.hero .row{display:flex;justify-content:space-between;align-items:flex-end;gap:32px;margin-top:40px;flex-wrap:wrap}
.hero p{max-width:460px;color:var(--mute);font-weight:300;font-size:19px}
.btn{display:inline-flex;gap:12px;align-items:center;font:500 13px var(--mono);letter-spacing:.1em;text-transform:uppercase;padding:16px 24px;border:1px solid var(--accent);color:var(--accent);border-radius:2px;transition:.2s;cursor:pointer;background:none}
.btn:hover{background:var(--accent);color:var(--bg)}

section{padding:112px 0;border-top:1px solid var(--line)}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:48px}
.sec-h h2{font:700 clamp(48px,7vw,88px)/.9 var(--display);text-transform:uppercase}

/* showreel */
.reel{position:relative;aspect-ratio:16/9;background:var(--bg2) center/cover;border:1px solid var(--line);cursor:pointer;overflow:hidden}
.reel iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.play{position:absolute;inset:0;display:grid;place-items:center}
.play i{width:96px;height:96px;border-radius:50%;border:1px solid var(--accent);display:grid;place-items:center;transition:.25s;backdrop-filter:blur(4px)}
.play i::after{content:"";border-left:22px solid var(--accent);border-top:13px solid transparent;border-bottom:13px solid transparent;margin-left:6px}
.reel:hover .play i{background:var(--accent);transform:scale(1.06)}
.reel:hover .play i::after{border-left-color:var(--bg)}
.reel .cap{position:absolute;left:20px;bottom:16px}

/* projects */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:32px 24px}
.card{cursor:pointer}
.thumb{aspect-ratio:16/9;background:var(--bg2) center/cover;border:1px solid var(--line);position:relative;overflow:hidden;transition:border-color .25s}
.thumb::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 50%,rgba(30,30,30,.7));opacity:.0;transition:.3s}
.card:hover .thumb{border-color:var(--accent)}
.card:hover .thumb::after{opacity:1}
.thumb .ph{position:absolute;inset:0;display:grid;place-items:center;font:700 64px var(--display);color:#3a3a3a;text-transform:uppercase}
.card h3{font:700 32px/1.1 var(--display);text-transform:uppercase;margin-top:14px;transition:color .2s}
.card:hover h3{color:var(--accent)}
.card .meta{display:flex;gap:14px;margin-top:4px}

/* about */
.about{display:grid;grid-template-columns:1fr 1.4fr;gap:64px}
.portrait{aspect-ratio:4/5;background:var(--bg2) center/cover;border:1px solid var(--line);display:grid;place-items:center;font:700 120px var(--display);color:#333}
.about p{font-weight:300;font-size:20px;margin-bottom:20px}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:40px;border-top:1px solid var(--line);padding-top:28px}
.facts b{display:block;font:700 56px/1 var(--display);color:var(--accent)}

/* contact */
.contact h2{font:900 clamp(56px,11vw,160px)/.88 var(--display);text-transform:uppercase}
.contact h2 a{color:var(--accent);border-bottom:2px solid transparent;transition:.2s}
.contact h2 a:hover{border-color:var(--accent)}
.links{display:flex;gap:28px;margin-top:40px;flex-wrap:wrap}
.links a{font:500 13px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mute);transition:color .2s}
.links a:hover{color:var(--accent)}
footer{padding:28px 0;border-top:1px solid var(--line)}
footer .wrap{display:flex;justify-content:space-between}

/* modal */
.modal{position:fixed;inset:0;background:rgba(15,15,15,.94);z-index:50;display:none;align-items:center;justify-content:center;padding:24px}
.modal.open{display:flex}
.modal .box{width:min(1100px,100%)}
.modal .frame{aspect-ratio:16/9;background:#000;border:1px solid var(--line);display:grid;place-items:center}
.modal iframe{width:100%;height:100%;border:0}
.modal h3{font:700 36px var(--display);text-transform:uppercase;margin-top:18px}
.modal p{color:var(--mute);font-weight:300;max-width:720px}
.modal .x{position:absolute;top:20px;right:24px;font:500 13px var(--mono);color:var(--fg);background:none;border:0;cursor:pointer;letter-spacing:.1em}
.modal .x:hover{color:var(--accent)}

@media(max-width:820px){
  nav ul li:not(:last-child){display:none}
  .about{grid-template-columns:1fr;gap:32px}
  .grid{grid-template-columns:1fr}
  section{padding:72px 0}
}
</style>
</head>
<body>

<header><div class="wrap"><nav>
  <a class="logo" href="#top">Ilya <b>Shpota</b></a>
  <ul>
    <li><a class="l" href="#reel" data-i18n="nav_reel"></a></li>
    <li><a class="l" href="#work" data-i18n="nav_work"></a></li>
    <li><a class="l" href="#about" data-i18n="nav_about"></a></li>
    <li><a class="l" href="#contact" data-i18n="nav_contact"></a></li>
    <li><button class="lang" id="lang">EN</button></li>
  </ul>
</nav></div></header>

<main id="top">
<div class="hero"><div class="wrap">
  <div class="mono" data-i18n="hero_kicker"></div>
  <h1>Ilya<br><span>Shpota</span></h1>
  <div class="row">
    <p data-i18n="hero_text"></p>
    <a class="btn" href="#reel">▶ <span data-i18n="watch"></span></a>
  </div>
</div></div>

<section id="reel"><div class="wrap">
  <div class="sec-h"><h2 data-i18n="nav_reel"></h2><span class="mono" id="reelYear"></span></div>
  <div class="reel" id="reelBox"><div class="play"><i></i></div><span class="cap mono" id="reelCap"></span></div>
</div></section>

<section id="work"><div class="wrap">
  <div class="sec-h"><h2 data-i18n="nav_work"></h2><span class="mono" id="count"></span></div>
  <div class="grid" id="grid"></div>
</div></section>

<section id="about"><div class="wrap about">
  <div class="portrait" id="portrait">IS</div>
  <div>
    <div class="mono" style="margin-bottom:16px" data-i18n="nav_about"></div>
    <div id="bio"></div>
    <div class="facts" id="facts"></div>
  </div>
</div></section>

<section id="contact" class="contact"><div class="wrap">
  <div class="mono" style="margin-bottom:20px" data-i18n="contact_kicker"></div>
  <h2><span data-i18n="contact_h"></span><br><a id="mail" href="#"></a></h2>
  <div class="links" id="links"></div>
</div></section>
</main>

<footer><div class="wrap mono"><span id="copy"></span><span>Shpota Productions</span></div></footer>

<div class="modal" id="modal" role="dialog" aria-modal="true">
  <button class="x" id="close">✕ ESC</button>
  <div class="box">
    <div class="frame" id="frame"></div>
    <h3 id="mTitle"></h3>
    <div class="mono" id="mMeta" style="margin:4px 0 10px"></div>
    <p id="mDesc"></p>
  </div>
</div>

<script>
/* =====================================================================
   ВСЁ СОДЕРЖИМОЕ САЙТА — ЗДЕСЬ. Замените плейсхолдеры своими данными.
   vimeo: ID видео (число из ссылки vimeo.com/123456789)
   poster: URL превью. Вставьте прямую ссылку на Vimeo CDN thumbnail
           (i.vimeocdn.com/video/...). Пусто — будет заглушка.
   ===================================================================== */
const SITE = {
  email: "ilyashpota@gmail.com",
  links: [
    { label: "Vimeo",     url: "https://vimeo.com/" },
    { label: "Instagram", url: "https://instagram.com/" },
    { label: "IMDb",      url: "https://imdb.com/" }
  ],
  reel: { vimeo: "", poster: "", year: "2026" },
  portrait: "",   // URL фото, пусто — инициалы
  facts: [ { n: "00", ru: "фильмов", en: "films" }, { n: "00", ru: "наград", en: "awards" }, { n: "00", ru: "лет в кино", en: "years in film" } ],
  projects: [
    { title: "Название проекта 01", year: "2025", role: { ru: "Режиссёр", en: "Director" }, type: { ru: "Короткий метр", en: "Short film" }, vimeo: "", poster: "", desc: { ru: "Короткое описание проекта: логлайн, фестивали, награды.", en: "Short project description: logline, festivals, awards." } },
    { title: "Название проекта 02", year: "2024", role: { ru: "Режиссёр", en: "Director" }, type: { ru: "Клип", en: "Music video" }, vimeo: "", poster: "", desc: { ru: "Короткое описание проекта.", en: "Short project description." } },
    { title: "Название проекта 03", year: "2023", role: { ru: "Режиссёр", en: "Director" }, type: { ru: "Реклама", en: "Commercial" }, vimeo: "", poster: "", desc: { ru: "Короткое описание проекта.", en: "Short project description." } }
  ]
};

const I18N = {
  ru: {
    nav_reel:"Шоурил", nav_work:"Работы", nav_about:"Обо мне", nav_contact:"Контакты",
    hero_kicker:"Режиссёр · Кино · Реклама · Клипы",
    hero_text:"Визуальные истории, в которых кадр работает так же сильно, как слово.",
    watch:"Смотреть шоурил", contact_kicker:"Сотрудничество", contact_h:"Давайте снимем что-то вместе",
    bio:["Здесь будет ваша биография: откуда вы, чему учились, что вас интересует как режиссёра.","Второй абзац: подход к работе, ключевые проекты, фестивали, команда."],
    projects:"проектов", soon:"Видео скоро появится"
  },
  en: {
    nav_reel:"Showreel", nav_work:"Work", nav_about:"About", nav_contact:"Contact",
    hero_kicker:"Director · Film · Commercials · Music videos",
    hero_text:"Visual stories where the frame speaks as loud as the word.",
    watch:"Watch showreel", contact_kicker:"Collaboration", contact_h:"Let's make something together",
    bio:["Your biography goes here: where you're from, what you studied, what drives you as a director.","Second paragraph: approach to work, key projects, festivals, team."],
    projects:"projects", soon:"Video coming soon"
  }
};

const $ = s => document.querySelector(s);
let lang = (() => { try { return localStorage.getItem("lang") } catch(e){} })() || ((navigator.language||"").startsWith("ru") ? "ru" : "en");

const vimeoEmbed = id => `<iframe src="https://player.vimeo.com/video/${id}?autoplay=1&title=0&byline=0&portrait=0&color=8FC4E8" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>`;
const bg = u => u ? `background-image:url('${u}')` : "";

function render(){
  const t = I18N[lang];
  document.documentElement.lang = lang;
  $("#lang").textContent = lang === "ru" ? "EN" : "RU";
  document.querySelectorAll("[data-i18n]").forEach(el => el.textContent = t[el.dataset.i18n]);

  $("#reelYear").textContent = SITE.reel.year;
  $("#reelBox").style.cssText = bg(SITE.reel.poster);
  $("#reelCap").textContent = "Showreel " + SITE.reel.year;

  $("#count").textContent = String(SITE.projects.length).padStart(2,"0") + " " + t.projects;
  $("#grid").innerHTML = SITE.projects.map((p,i) => `
    <article class="card" data-i="${i}" tabindex="0">
      <div class="thumb" style="${bg(p.poster)}">${p.poster ? "" : `<div class="ph">${p.title.slice(0,1)}</div>`}</div>
      <h3>${p.title}</h3>
      <div class="meta mono"><span>${p.year}</span><span>${p.type[lang]}</span><span>${p.role[lang]}</span></div>
    </article>`).join("");

  const pt = $("#portrait");
  pt.style.cssText = bg(SITE.portrait);
  pt.textContent = SITE.portrait ? "" : "IS";
  $("#bio").innerHTML = t.bio.map(x => `<p>${x}</p>`).join("");
  $("#facts").innerHTML = SITE.facts.map(f => `<div><b>${f.n}</b><span class="mono">${f[lang]}</span></div>`).join("");

  $("#mail").textContent = SITE.email;
  $("#mail").href = "mailto:" + SITE.email;
  $("#links").innerHTML = SITE.links.map(l => `<a href="${l.url}" target="_blank" rel="noopener">${l.label} ↗</a>`).join("");
  $("#copy").textContent = "© " + new Date().getFullYear() + " Ilya Shpota";
}

function openModal(title, meta, desc, vimeo){
  $("#frame").innerHTML = vimeo ? vimeoEmbed(vimeo) : `<span class="mono">${I18N[lang].soon}</span>`;
  $("#mTitle").textContent = title; $("#mMeta").textContent = meta; $("#mDesc").textContent = desc;
  $("#modal").classList.add("open"); document.body.style.overflow = "hidden";
}
function closeModal(){
  $("#modal").classList.remove("open"); $("#frame").innerHTML = ""; document.body.style.overflow = "";
}

$("#grid").addEventListener("click", e => {
  const c = e.target.closest(".card"); if(!c) return;
  const p = SITE.projects[c.dataset.i];
  openModal(p.title, `${p.year} · ${p.type[lang]} · ${p.role[lang]}`, p.desc[lang], p.vimeo);
});
$("#grid").addEventListener("keydown", e => { if(e.key === "Enter") e.target.click(); });
$("#reelBox").addEventListener("click", () => {
  if (SITE.reel.vimeo) { $("#reelBox").innerHTML = vimeoEmbed(SITE.reel.vimeo); $("#reelBox").style.cursor = "default"; }
  else openModal("Showreel " + SITE.reel.year, "", "", "");
});
$("#close").addEventListener("click", closeModal);
$("#modal").addEventListener("click", e => { if(e.target.id === "modal") closeModal(); });
document.addEventListener("keydown", e => { if(e.key === "Escape") closeModal(); });
$("#lang").addEventListener("click", () => {
  lang = lang === "ru" ? "en" : "ru";
  try { localStorage.setItem("lang", lang) } catch(e){}
  render();
});

render();
</script>
</body>
</html>
